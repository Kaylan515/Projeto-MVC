{% extends "base.html" %}

{% block title %}Editar usuário{% endblock %}

{% block content %}
<div class="card">
    <h1 class="page-title">Editar usuário</h1>

    {% if erro %}
        <div class="alert error">{{ erro }}</div>
    {% endif %}

    <form action="/usuarios/{{ editing_usuario.id }}/editar" method="post" class="form-grid">
        <div>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" value="{{ editing_usuario.nome }}" required>
        </div>
        <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" value="{{ editing_usuario.email }}" required>
        </div>
        <div>
            <label for="role">Perfil</label>
            <select id="role" name="role">
                <option value="operador" {% if editing_usuario.role == 'operador' %}selected{% endif %}>Operador</option>
                <option value="admin" {% if editing_usuario.role == 'admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>
        <div class="actions" style="grid-column: 1 / -1; justify-content: flex-start;">
            <button type="submit">Salvar alterações</button>
            <a class="button secondary" href="/usuarios">Cancelar</a>
        </div>
    </form>

    <p class="footer-note"><a class="small-link" href="/usuarios">← Voltar para lista de usuários</a></p>
</div>
{% endblock %}
