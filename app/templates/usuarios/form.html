<!-- templates/usuarios/form.html -->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{{ "Editar" if editando else "Novo" }} Usuário — Estoque</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        label {
            display: block;
            margin-top: 15px;
            color: #444;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: .2s;
        }

        input:focus,
        select:focus {
            border-color: #2ecc71;
            box-shadow: 0 0 5px rgba(46, 204, 113, .4);
        }

        .erro {
            background: #ffebeb;
            color: red;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .botoes {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2ecc71;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #27ae60;
        }

        .cancelar {
            flex: 1;
            text-align: center;
            text-decoration: none;
            background: #e74c3c;
            color: white;
            padding: 12px;
            border-radius: 8px;
            transition: .3s;
        }

        .cancelar:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            {{ "Editar usuário" if editando else "Novo usuário" }}
        </h1>

        {% if erro %}
        <div class="erro">
            {{ erro }}
        </div>
        {% endif %}

        <form action="{{ '/usuarios/' + editando.id|string + '/editar' if editando else '/usuarios/novo' }}"
            method="post">

            <label>Nome</label>

            <input type="text" name="nome"
                value="{{ editando.nome if editando else (valores.nome if valores else '') }}" required>

            <label>E-mail</label>

            <input type="email" name="email"
                value="{{ editando.email if editando else (valores.email if valores else '') }}" required>

            <label>Senha</label>

            <input type="password" name="senha" {{ "placeholder='Deixe vazio para manter a senha atual'" if editando
                else "required minlength='6'" }}>

            <label>Perfil de acesso</label>

            <select name="role">

                <option value="operador" {{ 'selected' if (editando and editando.role=='operador' ) or (valores and
                    valores.role=='operador' ) else '' }}>
                    Operador
                </option>

                <option value="admin" {{ 'selected' if (editando and editando.role=='admin' ) or (valores and
                    valores.role=='admin' ) else '' }}>
                    Administrador
                </option>

            </select>

            <div class="botoes">

                <button type="submit">
                    {{ "Salvar alterações" if editando else "Criar usuário" }}
                </button>

                <a href="/usuarios" class="cancelar">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</body>

</html>
