{% extends "base.html" %}

{% block title %}Novo usuário{% endblock %}

{% block content %}
<div class="card">
    <h1 class="page-title">Novo usuário</h1>

    {% if erro %}
        <div class="alert error">{{ erro }}</div>
    {% endif %}

    <form action="/usuarios/novo" method="post" class="form-grid">
        <div>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" value="{{ nome or '' }}" required>
        </div>
        <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required>
        </div>
        <div>
            <label for="role">Perfil</label>
            <select id="role" name="role">
                <option value="operador" {% if role == 'operador' %}selected{% endif %}>Operador</option>
                <option value="admin" {% if role == 'admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>

        <p class="form-footnote">Senha padrão: <strong>123456</strong> (o usuário deve alterá-la depois se desejar).</p>
        <button type="submit">Criar usuário</button>
    </form>

    <p class="form-footnote"><a class="small-link" href="/usuarios">← Voltar para lista de usuários</a></p>
</div>
{% endblock %}
