<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg,
                    #2ecc71,
                    #27ae60);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {

            background: white;

            width: 420px;

            padding: 40px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, .2);

        }

        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .perfil {

            background: #f4f4f4;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 30px;

            color: #555;

            font-size: 18px;
        }

        .role {
            font-weight: bold;
            color: #2ecc71;
        }

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .botao {

            text-decoration: none;

            background: #2ecc71;

            color: white;

            padding: 14px;

            border-radius: 8px;

            transition: .3s;
        }

        .botao:hover {
            background: #27ae60;
        }


        .logout {

            background: #e74c3c;
        }

        .logout:hover {

            background: #c0392b;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>

            Olá, {{ usuario.nome }} 👋

        </h1>


        <div class="perfil">

            Perfil:

            <span class="role">

                {{ usuario.role }}

            </span>

        </div>



        <div class="botoes">

            {% if usuario.role == "admin" %}

            <a href="/usuarios" class="botao">

                Gerenciar usuários

            </a>

            {% endif %}


            <a href="/auth/logout" class="botao logout">

                Sair

            </a>

        </div>


    </div>

</body>

</html>
