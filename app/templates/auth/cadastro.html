<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            background:
                linear-gradient(135deg,
                    #2ecc71,
                    #27ae60);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }



        .container {

            background: white;

            width: 420px;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, .2);

        }



        h1 {

            text-align: center;

            margin-bottom: 25px;

            color: #2c3e50;
        }



        label {

            display: block;

            margin-top: 15px;

            color: #555;

            font-weight: bold;
        }



        input {

            width: 100%;

            padding: 12px;

            margin-top: 8px;

            border-radius: 8px;

            border: 1px solid #ccc;

            outline: none;

            transition: .3s;
        }


        input:focus {

            border-color: #2ecc71;

            box-shadow:
                0 0 5px rgba(46, 204, 113, .4);

        }



        .botao {

            width: 100%;

            border: none;

            padding: 14px;

            margin-top: 25px;

            border-radius: 8px;

            background: #2ecc71;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: .3s;
        }


        .botao:hover {

            background: #27ae60;
        }



        .erro {

            background: #fdecea;

            color: red;

            padding: 10px;

            border-radius: 8px;

            margin-top: 15px;

            text-align: center;
        }



        .login {

            text-align: center;

            margin-top: 20px;

            color: #555;
        }


        .login a {

            text-decoration: none;

            color: #2ecc71;

            font-weight: bold;
        }


        .login a:hover {

            color: #27ae60;
        }

        .icone {

            text-align: center;

            font-size: 50px;

            margin-bottom: 10px;
        }
    </style>

</head>



<body>

    <div class="container">

        <div class="icone">

            👤

        </div>


        <h1>

            Criar Conta

        </h1>



        <form action="/auth/cadastro" method="post">


            <label>

                Nome

                <input type="text" name="nome" required>

            </label>



            <label>

                Email

                <input type="email" name="email" required>

            </label>



            <label>

                Senha

                <input type="password" name="senha" minlength="4" required>

            </label>



            <input class="botao" type="submit" value="Cadastrar">



            {% if error %}

            <div class="erro">

                {{ error }}

            </div>

            {% endif %}


        </form>



        <p class="login">

            Já tem conta?

            <a href="/auth/login">

                Entrar

            </a>

        </p>


    </div>

</body>

</html>
